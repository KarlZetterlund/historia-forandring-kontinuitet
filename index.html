<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Förändring & kontinuitet – 24 frågor</title><style>
:root{--navy:#102c44;--blue:#146b95;--bg:#f2f6fa;--line:#d5e2ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(115deg,#102c44,#1c5875);color:white;padding:28px 18px}header>div,main{max-width:800px;margin:auto}h1{font-size:clamp(1.5rem,4vw,2.25rem);margin:8px 0}header p{margin:4px 0;color:#dcecf5}main{padding:25px 16px 55px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:0 8px 28px #102c4410}.meta{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:.9rem;font-weight:700;color:#446277}.bar{height:9px;background:#e4edf3;border-radius:20px;overflow:hidden;margin:14px 0 25px}.fill{height:100%;background:var(--blue);width:0;transition:width .25s}.chip{display:inline-block;background:#e5f3f9;color:#145b7b;border-radius:30px;padding:6px 12px;font-size:.85rem;font-weight:750}h2{font-size:clamp(1.25rem,3vw,1.65rem);line-height:1.4;margin:17px 0 22px}.answers{display:grid;gap:11px}.answer{font:inherit;text-align:left;border:2px solid #d8e3eb;background:#fff;border-radius:12px;padding:15px 17px;cursor:pointer;color:var(--navy);line-height:1.45}.answer:not(:disabled):hover{border-color:#14759d;background:#f0f8fc}.answer:disabled{cursor:default}.answer.correct{background:#ddf6e5;border-color:#18884c;color:#115b32;font-weight:700}.answer.wrong{background:#ffe4e3;border-color:#cc3434;color:#8d1d1d;font-weight:700}.feedback{margin-top:19px;padding:16px 18px;border-radius:12px;line-height:1.55;background:#edf4f9;border-left:4px solid var(--blue)}.feedback.good{background:#e9f8ed;border-color:#16834b}.feedback.bad{background:#fff0ed;border-color:#c53e37}.next{margin-top:20px;background:var(--blue);color:white;border:0;border-radius:10px;padding:13px 21px;font:inherit;font-weight:750;cursor:pointer}.next:hover{background:#0e5175}.small{font-size:.9rem;color:#526e80}.result{font-size:2.2rem;font-weight:800;margin:12px 0}#summary{line-height:1.65}button:focus-visible{outline:3px solid #efb72c;outline-offset:3px}[hidden]{display:none!important}</style></head><body><header><div><div style="font-weight:750;letter-spacing:.09em;text-transform:uppercase;font-size:.8rem;color:#a7d9ef">Historia 1 · Analysquiz</div><h1>Förändring & kontinuitet</h1><p>Antikens Grekland → Romarriket → Medeltiden → Tidigmodern tid</p></div></header><main><section class="panel" id="quiz"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="bar"><div class="fill" id="progress"></div></div><span class="chip" id="epoch"></span><h2 id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback" hidden role="status" aria-live="polite"></div><button class="next" id="next" hidden>Nästa fråga →</button></section><section class="panel" id="finish" hidden><span class="chip">Quiz klart</span><h2>Du har genomfört alla 24 frågor!</h2><div class="result" id="finalscore"></div><p id="summary"></p><button class="next" id="restart">Gör quizet igen ↻</button></section><p class="small">Bygger på faktakorten om förändring och kontinuitet. Ett rätt svar per fråga. Frågorna och svarsalternativen blandas vid varje försök.</p></main><script>
const bank=[{"epoch":"Grekland → Romarriket","q":"Vad förändrades politiskt från Greklands stadsstater till Romarriket?","options":["Aten och Sparta var stadsstater, medan Rom utvecklades till ett kejsarstyrt imperium.","Aten och Sparta styrdes av kejsare, medan Rom blev självständiga stadsstater.","Greklands stadsstater förenades under en senat, medan Rom saknade centralmakt.","Aten och Sparta bildade en republik, medan Rom förblev en grekisk koloni."],"explain":"Aten och Sparta var självständiga stadsstater med olika styrelsesätt. Rom hade först republik med senat och konsuler, men Augustus blev ensam härskare år 27 f.v.t. Förändringen var övergången till ett vidsträckt romerskt imperium.","id":1},{"epoch":"Grekland → Romarriket","q":"Vad var en kontinuitet från Atens demokrati till den romerska republiken?","options":["I Aten röstade fria manliga medborgare; i Rom hade senaten och folkförsamlingarna makt, men många utestängdes.","I Aten röstade kvinnor i folkförsamlingen; i Rom förlorade kvinnor sin rösträtt.","I Aten utsågs konsuler genom val; i Rom övergick makten till ärftliga kungar.","I Aten styrde patricier senaten; i Rom fick alla invånare lika politiska rättigheter."],"explain":"I Aten kunde fria manliga medborgare rösta i folkförsamlingen, medan kvinnor, slavar och inflyttade saknade rösträtt. I den senare romerska republiken delades makten mellan senaten, konsuler och folkförsamlingar. Patricierna dominerade länge senaten, men plebejerna fick gradvis större rättigheter.","id":2},{"epoch":"Grekland → Romarriket","q":"Vad var en social kontinuitet från Greklands stadsstater till Romarriket?","options":["I Aten saknade slavar medborgarrätt; i Rom var slaveri också en del av samhället.","I Aten var slavar fria medborgare; i Rom förbjöds slaveri under republiken.","I Sparta saknades sociala grupper; i Rom uppstod samhällsklasser först under kejsartiden.","I Aten fick alla invånare rösta; i Rom begränsades rösträtten för första gången."],"explain":"I Aten saknade slavar politiska rättigheter, och i Sparta tvingades heloter arbeta åt spartanerna. Även i Romarriket användes slavarbete i hushåll och jordbruk. Kontinuiteten var att ofria människor hade en underordnad ställning.","id":3},{"epoch":"Grekland → Romarriket","q":"Vad levde vidare kulturellt från Grekland till Romarriket?","options":["Grekiska filosofer som Aristoteles påverkade romerskt tänkande och utbildning.","Romarna förbjöd Platons texter och ersatte filosofin med enbart militär utbildning.","Sokrates grundade den romerska senaten och skapade republikens lagar.","Romerska kejsare uppfann de grekiska tempelstilarna efter Västroms fall."],"explain":"Grekiska tänkare som Platon och Aristoteles verkade före Romarrikets storhetstid. Romarna tog intryck av grekisk filosofi, konst och arkitektur. Kontinuiteten syns bland annat i romerska byggnader med grekiskt inspirerade kolonner.","id":4},{"epoch":"Grekland → Romarriket","q":"Varför växte handeln under Pax Romana jämfört med tidigare stadsstater?","options":["Romersk kontroll och relativ fred gjorde transporter över Medelhavet tryggare.","Aten förbjöd sjöfart, vilket tvingade romarna att börja handla på land.","Rom avskaffade vägnätet och flyttade all handel till lokala marknader.","Sparta skapade Pax Romana genom att förena de grekiska stadsstaterna."],"explain":"Pax Romana betecknar en lång period av relativ fred inom Romarriket, från Augustus tid. Romerska vägar, hamnar och kontroll över stora områden underlättade handel. Jämfört med de grekiska stadsstaterna knöts fler områden samman under samma styre.","id":5},{"epoch":"Grekland → Romarriket","q":"Vad var en ekonomisk kontinuitet från Grekland till Romarriket?","options":["Grekiska köpmän seglade på Medelhavet, och romarna fortsatte använda samma hav för handel.","Grekiska stadsstater levde utan sjöfart, medan romarna först upptäckte Medelhavet.","Grekland handlade bara med jordbruk, medan Rom helt slutade importera varor.","Aten styrde handeln över Atlanten, medan Rom enbart handlade inom Italien."],"explain":"Grekiska stadsstater som Aten handlade över Medelhavet med bland annat olivolja och keramik. Romarna fortsatte använda sjövägarna för att frakta spannmål och andra varor. Kontinuiteten var Medelhavets betydelse som handelsområde.","id":6},{"epoch":"Grekland → Romarriket","q":"Vad bestod socialt från Greklands stadsstater till Romarriket?","options":["Både Aten och Rom hade slavar och tydliga skillnader mellan samhällsgrupper.","Aten saknade slavar, men Rom införde slaveri för första gången.","Alla fria invånare var jämlika i Aten, och Rom behöll samma rättigheter.","Sparta hade allmän rösträtt, och Rom överförde den till hela imperiet."],"explain":"I Aten hade manliga medborgare särskilda rättigheter, medan kvinnor, slavar och inflyttade stod utanför politiken. I Rom skilde man bland annat mellan patricier och plebejer, och slaveri förekom. Social ojämlikhet bestod trots förändrade samhällsformer.","id":7},{"epoch":"Grekland → Romarriket","q":"Vad förändrades och bestod religiöst från Grekland till Romarriket?","options":["Romarna övertog grekiska gudaföreställningar, men kristendomen fick senare en stark ställning.","Grekernas Zeus blev kristendomens gud redan i Aten under 400-talet f.v.t.","Romarna förbjöd alla grekiska gudar direkt när republiken bildades.","Kristendomen försvann ur Romarriket när kejsar Konstantin tillät den."],"explain":"Grekernas Zeus motsvarades av romarnas Jupiter, och flera gudaföreställningar levde vidare. Under romersk kejsartid spreds kristendomen. Kejsar Konstantin tillät kristen religionsutövning år 313, och kristendomen fick senare en dominerande ställning.","id":8},{"epoch":"Romarriket → Medeltiden","q":"Vad förändrades politiskt från Västrom till tidig medeltid?","options":["Västroms kejsarmakt föll år 476, och flera germanska kungadömen växte fram.","Västroms senat fortsatte styra alla provinser från Rom under hela medeltiden.","Östrom föll år 476, och Aten blev huvudstad för hela Västeuropa.","Germanska kungadömen avskaffades år 476 när Augustus tog makten."],"explain":"År 476 avsattes Västroms siste kejsare, Romulus Augustulus. I Västeuropa växte bland annat frankiska och ostrogotiska riken fram. Den politiska makten blev mer uppdelad än under den västromerska kejsarmakten, medan Östrom levde vidare.","id":9},{"epoch":"Romarriket → Medeltiden","q":"Vad levde vidare från Romarriket in i medeltiden?","options":["Östrom fortsatte som ett romerskt kejsarrike efter Västroms fall år 476.","Västroms kejsare fortsatte styra från Rom utan avbrott till år 1453.","Den romerska republiken återinfördes i alla germanska kungadömen år 476.","Aten blev huvudstad i Östrom när Västroms kejsare avsattes."],"explain":"Västroms kejsarmakt upphörde år 476, men Östrom bestod med Konstantinopel som huvudstad. Där levde romerska lagar, institutioner och kejsarstyre vidare. Östrom, som senare ofta kallas Bysantinska riket, föll först år 1453.","id":10},{"epoch":"Romarriket → Medeltiden","q":"Vad var en religiös kontinuitet från Romarriket till medeltiden?","options":["Kristendomen hade stärkts i Romarriket och fortsatte prägla medeltidens Europa.","Kristendomen uppstod i frankerriket först efter Västroms fall år 476.","Kejsar Konstantin avskaffade kyrkan innan medeltiden började.","Medeltidens kloster återinförde den grekiska gudavärlden som statsreligion."],"explain":"Kejsar Konstantin tillät kristen religionsutövning år 313. Under 300-talet stärktes kristendomens ställning i Romarriket. Efter Västroms fall fortsatte kyrkan att organisera religiöst liv och fick stor betydelse för utbildning och politik under medeltiden.","id":11},{"epoch":"Romarriket → Medeltiden","q":"Vad förändrades ekonomiskt från Västrom till tidig medeltid?","options":["Handeln minskade i delar av Västeuropa, och jordbruk samt naturahushållning blev viktigare.","Romerska vägar försvann över en natt, och allt jordbruk upphörde.","Pax Romana inleddes år 476 och ökade handeln i alla västeuropeiska städer.","Medeltidens bönder övergav åkrarna när romerska fabriker byggdes ut."],"explain":"Romarriket hade vägar, städer och handel över Medelhavet. Efter Västroms fall minskade den långväga handeln i delar av Västeuropa. Fler människor levde främst av jordbruk och naturahushållning, men handel och städer försvann inte helt.","id":12},{"epoch":"Romarriket → Medeltiden","q":"Vad var en ekonomisk kontinuitet från Romarriket till medeltiden?","options":["Handel fortsatte på marknader och längs handelsvägar även när Västeuropas handel minskade.","Alla romerska handelsvägar stängdes år 476 och öppnades först på 1500-talet.","Medeltidens bönder slutade sälja överskott eftersom mynt förbjöds överallt.","Romarrikets handel byggde enbart på byteshandel utan städer eller hamnar."],"explain":"Romarriket hade omfattande handel längs vägar och över Medelhavet. Under tidig medeltid minskade handeln i många västeuropeiska områden, men lokala marknader och vissa långväga handelskontakter fanns kvar. Kontinuiteten var att människor fortsatte utbyta varor.","id":13},{"epoch":"Romarriket → Medeltiden","q":"Vad förändrades i kunskapens spridning från Romarriket till medeltiden?","options":["Vissa romerska skolmiljöer försvagades, medan kloster bevarade och kopierade böcker.","Alla romerska böcker förstördes år 476 och ingen antik kunskap överlevde.","Universitet grundades i varje romersk provins direkt efter Västroms fall.","Medeltidens munkar förbjöds att läsa och skriva av den romerska senaten."],"explain":"Efter Västroms fall försvagades flera äldre utbildningsmiljöer i väst. I kloster kopierade munkar religiösa texter och delar av antikens litteratur. Senare växte universitet fram, exempelvis i Bologna. Kunskapen försvann alltså inte, men dess spridning förändrades.","id":14},{"epoch":"Romarriket → Medeltiden","q":"Vad var en social kontinuitet från Romarriket till medeltiden?","options":["Romerska samhällsgrupper och medeltida stånd skilde sig åt, men stora maktskillnader bestod.","Romerska slavar fick automatiskt adelstitlar när Västrom föll år 476.","Medeltidens bönder fick samma privilegier som biskopar och kungar.","Patricierna behöll exakt samma rättigheter i alla medeltida kungadömen."],"explain":"I Romarriket skilde sig rättigheter och villkor mellan exempelvis fria medborgare och slavar. Under medeltiden hade adel och prästerskap ofta privilegier, medan många bönder var beroende av jordägare. Kontinuiteten var stora sociala skillnader.","id":15},{"epoch":"Romarriket → Medeltiden","q":"Vad förändrades från romersk kejsarmakt till medeltidens feodalism?","options":["Romerska kejsare styrde med ämbetsmän; medeltida kungar kunde ge jord till vasaller.","Romerska kejsare valdes av vasaller, medan medeltida kungar styrde med senaten.","Romerska provinser var självständiga stadsstater, medan medeltiden saknade lokala herrar.","Feodalismen innebar att alla bönder fick egen jord utan skyldigheter till adeln."],"explain":"I Romarriket styrde kejsaren genom bland annat armé, ämbetsmän och skatteuppbörd. I delar av medeltidens Europa gav kungar och stormän jord eller inkomster till vasaller mot trohet och militärt stöd. Lokal makt blev viktigare.","id":16},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad förändrades religiöst från medeltiden till reformationen?","options":["Luthers kritik år 1517 bidrog till att protestantiska kyrkor bröt med påven.","Påven grundade protestantismen år 1517 för att ena hela Västeuropa.","Luther avskaffade kristendomen och ersatte den med antikens romerska religion.","Reformationen gjorde att alla europeiska länder omedelbart blev protestantiska."],"explain":"Under medeltiden hade den katolska kyrkan stark ställning i Västeuropa. År 1517 kritiserade Martin Luther bland annat avlatshandeln. Hans idéer spreds med tryckta skrifter och bidrog till reformationen, då flera protestantiska kyrkor växte fram.","id":17},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad levde vidare från medeltiden trots reformationen?","options":["Kristendomen fortsatte påverka lagar, vardagsliv och furstars beslut även efter kyrkans splittring.","Efter 1517 förbjöd alla protestantiska länder gudstjänster och kyrkobyggnader.","Reformationen gjorde att Europas kungar omedelbart slutade stödja religion.","Luthers reformer innebar att medeltidens kristna högtider avskaffades överallt."],"explain":"Reformationen på 1500-talet splittrade den västeuropeiska kyrkan i katolska och protestantiska riktningar. Religionen fortsatte ändå påverka undervisning, gudstjänster och politiska beslut. Både katolska och protestantiska furstar använde kristendomen för att motivera sin makt.","id":18},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad förändrades politiskt från medeltidens feodalism till absolutismen?","options":["Kungar som Ludvig XIV samlade större makt och hänvisade till gudomlig rätt.","Medeltidens vasaller införde allmän rösträtt och valde Ludvig XIV till president.","Frankrikes senat avskaffade kungamakten när Ludvig XIV blev kung.","Absolutismen innebar att adelns privilegier upphörde i alla europeiska länder."],"explain":"Under medeltiden delade kungar ofta makt med mäktiga adelsmän. På 1600-talet blev Ludvig XIV i Frankrike en symbol för absolutismen, där kungen samlade större makt. Kungens ställning motiverades bland annat med gudomlig rätt.","id":19},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad bestod socialt från medeltiden till tidigmodern tid?","options":["Adeln behöll privilegier, och bönder hade ofta mindre politisk makt än överklassen.","Adeln förlorade alla privilegier när Ludvig XIV började regera i Frankrike.","Medeltidens stånd ersattes omedelbart av lika rösträtt för alla invånare.","Bönderna blev Europas enda jordägare när kungamakten stärktes på 1600-talet."],"explain":"Under medeltiden hade adel och prästerskap särskilda privilegier, medan många bönder saknade politiskt inflytande. Även när kungamakten stärktes under tidigmodern tid bestod ståndsskillnaderna. I Frankrike behöll adeln viktiga privilegier fram till revolutionen 1789.","id":20},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad förändrades i handeln från senmedeltiden till tiden efter 1492?","options":["Efter Columbus resa 1492 växte Atlant­handeln och Spanien och Portugal byggde kolonialvälden.","Efter Columbus resa 1492 upphörde all handel över Medelhavet.","Under senmedeltiden kontrollerade Romarrikets kejsare kolonierna i Amerika.","Spanien och Portugal slutade handla med Europa när de nådde Amerika."],"explain":"Under senmedeltiden växte europeisk handel genom städer och handelsnätverk. Efter Columbus resa 1492 ökade handeln över Atlanten. Spanien och Portugal byggde kolonialvälden, och handeln kom att omfatta tvångsarbete och förslavade afrikaner.","id":21},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad var en kontinuitet i handeln från medeltiden till tidigmodern tid?","options":["Handel skapade rikedom under båda epokerna, samtidigt som människor kunde exploateras.","Handel började först när Columbus nådde Amerika år 1492.","Medeltidens köpmän använde inga handelsvägar mellan europeiska städer.","Kolonialhandeln avskaffade tvångsarbete och slaveri redan under 1500-talet."],"explain":"Under medeltiden tjänade köpmän pengar genom handel mellan städer och regioner. Under tidigmodern tid växte handeln över Atlanten, bland annat genom kolonier och slavhandel. Kontinuiteten var både handelns ekonomiska betydelse och att människor kunde utnyttjas.","id":22},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad förändrades i idéernas spridning från medeltiden till renässansen?","options":["Renässansen ökade intresset för antiken, och Gutenbergs tryckteknik spred texter snabbare.","Renässansens lärda förbjöd Platons och Aristoteles verk på Europas universitet.","Gutenberg uppfann handskriften, så böcker blev svårare att sprida än under medeltiden.","Universiteten i Bologna och Paris grundades först efter 1700-talets upplysning."],"explain":"Medeltidens kloster och universitet bevarade och studerade äldre texter. Under renässansen växte intresset för antikens konst och tänkande. Gutenbergs tryckteknik kring 1450 gjorde det lättare att framställa och sprida böcker i större upplagor.","id":23},{"epoch":"Medeltiden → Tidigmodern tid","q":"Vad förändrades och bestod när den geocentriska världsbilden utmanades?","options":["Copernicus och Galileo ifrågasatte jordens centrumställning, men religionen fortsatte påverka världsbilden.","Copernicus bevisade att solen kretsade kring jorden, vilket avslutade astronomin.","Galileo införde den geocentriska modellen som kyrkans första förklaring av universum.","När heliocentrismen föreslogs försvann religiösa föreställningar genast ur Europa."],"explain":"Under medeltiden var den geocentriska modellen, med jorden i centrum, vanlig. Copernicus presenterade en solcentrerad modell år 1543, och Galileo gjorde senare observationer som stödde den. Vetenskapliga förklaringar förändrades, men religionen fortsatte påverka människors världsbild.","id":24}];let questions=[],index=0,points=0,answered=false,perEpoch={};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const el=id=>document.getElementById(id);
function start(){questions=shuffle(bank).map(q=>({...q,choices:shuffle(q.options.map((t,i)=>({text:t,correct:i===0})))}));index=0;points=0;perEpoch={};el('quiz').hidden=false;el('finish').hidden=true;render()}
function render(){answered=false;const q=questions[index];el('counter').textContent=`Fråga ${index+1} av ${questions.length}`;el('score').textContent=`Rätt: ${points}`;el('progress').style.width=`${index/questions.length*100}%`;el('epoch').textContent=q.epoch;el('question').textContent=q.q;el('feedback').hidden=true;el('next').hidden=true;el('answers').replaceChildren();q.choices.forEach(c=>{let b=document.createElement('button');b.className='answer';b.textContent=c.text;b.addEventListener('click',()=>choose(c,b));el('answers').append(b)})}
function choose(c,btn){if(answered)return;answered=true;const q=questions[index];if(!perEpoch[q.epoch])perEpoch[q.epoch]={right:0,total:0};perEpoch[q.epoch].total++;if(c.correct){points++;perEpoch[q.epoch].right++}for(const b of el('answers').children){b.disabled=true;const choice=q.choices[[...el('answers').children].indexOf(b)];if(choice.correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')};const f=el('feedback');f.hidden=false;f.className='feedback '+(c.correct?'good':'bad');f.textContent=(c.correct?'Rätt! ':'Inte riktigt. ')+q.explain;el('score').textContent=`Rätt: ${points}`;el('next').hidden=false;el('next').textContent=index===questions.length-1?'Visa resultat →':'Nästa fråga →'}
el('next').addEventListener('click',()=>{index++;if(index<questions.length)render();else{el('quiz').hidden=true;el('finish').hidden=false;el('finalscore').textContent=`${points} av ${questions.length} rätt (${Math.round(points/questions.length*100)} %) `;el('summary').replaceChildren();for(const [epoch,s] of Object.entries(perEpoch)){const p=document.createElement('p');p.textContent=`${epoch}: ${s.right} av ${s.total} rätt`;el('summary').append(p)}window.scrollTo(0,0)}});el('restart').addEventListener('click',start);start();
</script></body></html>
